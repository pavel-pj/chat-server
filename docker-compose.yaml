services:
  postgres:
    image: postgres:18
    container_name: postgres-chat
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
       - "${PG_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  jaeger:
    image: jaegertracing/all-in-one:1.48
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"  
      - "14268:14268"
      - "9411:9411"
    

volumes:
  pgdata: